<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Breng GEORGE op Orde!</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Leaflet.markercluster CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
  />

  <!-- MapLibre GL CSS (renders the NDW basemap style) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
  />

  <!-- Map + UI styling -->
  <link rel="stylesheet" href="style.css" />

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""></script>

  <!-- MapLibre GL JS + Leaflet plugin: shows the NDW vector basemap style in Leaflet -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>

  <!-- Leaflet.markercluster JS (groups nearby markers) -->
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Leaflet.VectorGrid JS (draws the NDW wegvakken vector tiles) -->
  <script src="https://unpkg.com/leaflet.vectorgrid@1.3.0/dist/Leaflet.VectorGrid.bundled.js"></script>
</head>

<body>

<!-- =========================================================
     HEADER (title + sidebar toggle)
========================================================= -->
<header>
  Breng je borden op orde :)
  <button id="toggleSidebar">☰ Filters</button>
</header>

<!-- =========================================================
     SIDEBAR (filters UI)
========================================================= -->
<div id="sidebar">

  <!-- Status filter -->
  <h3>Kies status:</h3>

  <div class="actions">
    <button id="selectAllStatuses">Selecteer alles</button>
    <button id="clearAllStatuses">Deselecteer alles</button>
  </div>

  <div id="statusFilters"></div>

  <!-- RVV-code filter -->
  <h3>Kies RVV-code(s):</h3>

  <input
    type="text"
    id="rvvCodeSearch"
    placeholder="Zoek in lijst..."
  />

  <div class="rvvCode-actions">
    <button id="clearRvvCodes">Deselecteer alles</button>
  </div>

  <div id="rvvCodeFilters"></div>

  <!-- NDW wegvakken -->
  <h3>NDW-wegvakken:</h3>

  <label class="wegvak-toggle">
    <input type="checkbox" id="showWegvakken">
    Toon NDW-wegvakken
  </label>

  <div id="wegvakInfo"></div>

</div>

<!-- =========================================================
     MAP CONTAINER
========================================================= -->
<div id="map"></div>
<div id="mapMessage" hidden></div>

<!-- =========================================================
     JAVASCRIPT APPLICATION LOGIC
========================================================= -->
<script src="app.js"></script>
<script src="wegvakken.js"></script>

</body>
</html>
